<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatID Messenger</title>
    <meta name="description" content="Aplikasi chatting bergaya WhatsApp berbasis ID unik dengan enkripsi pesan, kirim foto, sinkronisasi ID, dan database riwayat chat." />
    <meta property="og:title" content="ChatID Messenger" />
    <meta property="og:description" content="Aplikasi chatting bergaya WhatsApp berbasis ID unik dengan enkripsi pesan, kirim foto, sinkronisasi ID, dan database riwayat chat." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chrome 55 and legacy browser early runtime polyfills -->
    <script>
      (function() {
        if (typeof window.globalThis === 'undefined') {
          window.globalThis = window;
        }
        if (typeof window.BigInt === 'undefined') {
          window.BigInt = function(val) {
            return typeof val === 'number' ? Math.floor(val) : parseInt(val, 10) || 0;
          };
        }
        if (typeof window.AbortController === 'undefined') {
          function SimpleAbortSignal() {
            this.aborted = false;
            this._listeners = [];
          }
          SimpleAbortSignal.prototype.addEventListener = function(type, fn) {
            if (type === 'abort' && typeof fn === 'function') this._listeners.push(fn);
          };
          SimpleAbortSignal.prototype.removeEventListener = function(type, fn) {
            if (type === 'abort') {
              this._listeners = this._listeners.filter(function(l) { return l !== fn; });
            }
          };
          SimpleAbortSignal.prototype.dispatchEvent = function() { return true; };
          function SimpleAbortController() {
            this.signal = new SimpleAbortSignal();
          }
          SimpleAbortController.prototype.abort = function() {
            if (!this.signal.aborted) {
              this.signal.aborted = true;
              for (var i = 0; i < this.signal._listeners.length; i++) {
                try { this.signal._listeners[i].call(this.signal); } catch (e) {}
              }
            }
          };
          window.AbortController = SimpleAbortController;
          window.AbortSignal = SimpleAbortSignal;
        }
        if (typeof window.queueMicrotask === 'undefined') {
          window.queueMicrotask = function(callback) {
            Promise.resolve().then(callback).catch(function(err) {
              setTimeout(function() { throw err; }, 0);
            });
          };
        }
        if (typeof window.crypto === 'undefined') {
          window.crypto = {};
        }
        if (typeof window.crypto.getRandomValues === 'undefined') {
          window.crypto.getRandomValues = function(buffer) {
            for (var i = 0; i < buffer.length; i++) {
              buffer[i] = Math.floor(Math.random() * 256);
            }
            return buffer;
          };
        }
      })();
    </script>
  </head>
  <body class="bg-[#111b21] text-[#e9edef] antialiased overflow-hidden select-none">
    <div id="root">
      <div style="min-height: 100vh; background-color: #111b21; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #e9edef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(0, 168, 132, 0.2); border-top-color: #00a884; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 13px; color: #8696a0;">Memuat ChatID Messenger...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Legacy Chrome 55 failsafe: trigger System.import if root remains empty after load
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          var isDefaultLoading = root && root.querySelector('style');
          if (isDefaultLoading && window.System) {
            var entry = document.getElementById('vite-legacy-entry');
            if (entry) {
              var src = entry.getAttribute('data-src');
              if (src) {
                console.log('[Chrome 55] Fallback trigger System.import for:', src);
                window.System.import(src).catch(function(err) {
                  console.error('[Chrome 55] System.import load error:', err);
                });
              }
            }
          }
        }, 1200);
      });
    </script>
  </body>
</html>
